<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WannaSmile Official Links Board</title>
<meta name="description" content="The live board of official wannasmile links, loaded straight from our sheet.">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="WannaSmile Official Links Board">
<meta property="og:description" content="Always up to date. Always checked. Find the real wannasmile here.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#111 url("https://raw.githubusercontent.com/wannasmile4evr/mediabaseWS/main/themes/redux/headerBg.png") repeat;color:#e8e8e8;font:13px/1.5 "Courier New",Consolas,monospace;padding-bottom:28px}
main{max-width:1800px;margin:0 auto;padding:22px 14px}
.hero{text-align:center;margin:10px auto 26px;padding:0 56px}
.hero h1{margin:0;color:#fff;font-size:clamp(20px,4.6vw,32px);line-height:1.2;text-shadow:0 2px 10px #000}
.dc{position:absolute;top:14px;right:16px;width:44px;height:44px;display:grid;place-items:center;background:#111;color:#fff;font-size:24px;text-decoration:none}
.dc:hover{background:#5865f2}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 16px}
.chip{cursor:pointer;border:1px solid #555;background:#1b1b1b;color:#ddd;padding:3px 10px;font:inherit;font-size:12px;border-radius:8px}
.chip:hover{background:#2a2a2a}
.chip[aria-pressed=true]{background:#f1f1f1;color:#111;border-color:#f1f1f1}
.notice{max-width:640px;margin:0 auto 16px;padding:8px 12px;background:#1b1b1b;border:1px dashed #ffc857;color:#ffc857;font-size:12px;text-align:center;border-radius:8px}
.grid{--cols:1;--cw:740px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;width:100%;max-width:calc(var(--cols)*var(--cw) + (var(--cols) - 1)*14px);margin:0 auto}
.card{container-type:inline-size;display:flex;flex-direction:column;background:#151515;border:1px solid #333;border-radius:12px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.45);transition:border-color .2s,transform .2s}
.card:hover{border-color:#777;transform:translateY(-2px)}
.card.official{border:2px solid transparent}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #2c2c2c}
.av{flex:none;width:42px;height:42px;object-fit:cover;border-radius:8px;background:#e8e8e8;color:#111;display:grid;place-items:center;font-weight:700;font-size:15px}
.name{font-weight:700;font-size:21px;line-height:1.2;overflow-wrap:anywhere;color:#fff}
.by{font-size:12px;color:#9a9a9a}
.trailer{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;border:0;border-bottom:1px solid #2c2c2c;background:#000;cursor:pointer;padding:0}
.trailer img,.trailer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.trailer span{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;text-shadow:0 1px 8px #000}
.body{flex:1;display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:14px 16px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.info{margin:0;padding:0;list-style:none;font-size:12.5px;color:#d6d6d6}
.info li.bul::before{content:"- "}
.warn{font-size:11.5px;color:#9a9a9a;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;flex:none;max-width:45%}
.b{font-size:11px;padding:0 6px;border:1px solid #666;color:#bbb}
.b.works{color:#3ddc97;border-color:#3ddc97}.b.blocked{color:#ff6b78;border-color:#ff6b78}.b.unknown,.b.ad{color:#ffc857;border-color:#ffc857}
.b.off,.b.here{background:#f1f1f1;color:#111;border-color:#f1f1f1}
.acts{display:flex;gap:8px;padding:0 16px 16px}
.go{flex:1;text-align:center;text-decoration:none;color:#111;background:#f1f1f1;font-weight:700;padding:10px;border-radius:0}
.go:hover{background:#fff}
.cp{cursor:pointer;border:1px solid #888;background:transparent;color:#eee;padding:0 16px;font:inherit;border-radius:0}
.cp:hover{background:#2a2a2a}
.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:30px 0}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@container (max-width:520px){.body{flex-direction:column}.badges{justify-content:flex-start;max-width:none}}
@container (max-width:420px){.name{font-size:17px}.top,.body{padding:12px}.acts{padding:0 12px 12px}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(min(var(--cols),3),minmax(0,1fr))}}
@media(max-width:700px){.grid{grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr))}}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="dc" href="https://discord.gg/UKbQ2s8pJA" target="_blank" rel="noopener noreferrer" title="join our server!" aria-label="join our server!"><i class="fa-brands fa-discord" aria-hidden="true"></i></a>
<main>
  <div class="hero">
    <h1>WannaSmile Official Links Board</h1>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div class="notice" id="notice" hidden></div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>
<script>
// Paste your deployed /exec url here (data.gs web app).
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyFsLxR-ZqoFLw402Thh_Qnpec7CJLo1GVDYJeakYIGA7_gZnaMqYRCQ3Txwlgm_sSq/exec";

const REFRESH_MS = 60000, CACHE_KEY = "wsboard:v1";
// Card looks. Unknown styles fall back to "default". Add new ones here and in CSS (.card.s-<name>).
const STYLES = ["default"];

const DEMO = {ok:true,canonicalOwner:"ankomstudios",updated:new Date().toISOString(),items:[
  {name:"More Hallows",version:"2.3.0",trailer:"vonRpwOq4zg",info:"new update! finally XD\n- 10 pages\n- RAW CDN NETWORK\n- Proxy Based .io hotlinks\n- Very easy to modify & Contribute too ^^",devBy:"THAWDABASE",devImg:"",sourceTruth:"ankomstudios",url:"https://vvannazmile.github.io./",status:"works",type:"ws",style:"default",official:true},
  {name:"Unofficial example",version:"1.0.0",trailer:"",info:"your unofficial info here for a fork of wannasmile :p",devBy:"someone",devImg:"",sourceTruth:"someone",url:"https://example.com/",status:"unknown",type:"fork",style:"default",official:false}]};

const $ = id => document.getElementById(id);
const TYPE_LABEL = {ws:"wannasmile",fork:"fork",external:"external",ad:"ad"};
const CW = {1:740,2:460,3:380,4:340,5:310,6:290}; // target card width by cards per row (max 6)
let data = null, filter = "all", lastGood = 0;

function el(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function safeUrl(u){try{const x=new URL(String(u).trim());return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}}
function ago(iso){const s=(Date.now()-Date.parse(iso))/1000;if(!isFinite(s)||s<0)return "just now";if(s<90)return "just now";if(s<3600)return Math.round(s/60)+" min ago";return Math.round(s/3600)+" h ago"}
function setLive(){}

function hostOf(u){try{return new URL(u).host.replace(/\.$/,"")}catch(e){return ""}}

function card(it, i){
  const style = STYLES.includes(it.style) ? it.style : "default";
  const href = safeUrl(it.url);
  const c = el("article","card s-"+style+(it.official?" official":""));

  const top = el("div","top");
  const t = el("div"); t.append(el("div","name",it.name||"untitled"));
  if(it.devBy) t.append(el("div","by","by "+it.devBy));
  top.append(t);
  const initial = (it.devBy||it.name||"?").charAt(0).toUpperCase();
  const imgUrl = safeUrl(it.devImg);
  if(imgUrl){
    const im = el("img","av"); im.src=imgUrl; im.alt=""; im.loading="lazy"; im.referrerPolicy="no-referrer";
    im.onerror=()=>im.replaceWith(el("div","av",initial));
    top.append(im);
  } else top.append(el("div","av",initial));
  c.append(top);

  if(it.trailer){
    const tb = el("button","trailer"); tb.type="button"; tb.setAttribute("aria-label","Play trailer");
    const th = el("img"); th.src="https://i.ytimg.com/vi/"+it.trailer+"/hqdefault.jpg"; th.alt=""; th.loading="lazy"; th.referrerPolicy="no-referrer";
    tb.append(th, el("span","","▶"));
    tb.onclick=()=>{const f=document.createElement("iframe");f.src="https://www.youtube-nocookie.com/embed/"+it.trailer+"?autoplay=1&rel=0";f.allow="autoplay; encrypted-media; picture-in-picture";f.allowFullscreen=true;f.title="Trailer";tb.replaceChildren(f)};
    c.append(tb);
  }

  const body = el("div","body"), txt = el("div","txt");
  const lines = String(it.info||"").split("\n").map(s=>s.trim()).filter(Boolean);
  if(lines.length){
    const ul = el("ul","info");
    lines.forEach(l=>{const bul=/^[-•*]\s*/.test(l);ul.append(el("li",bul?"bul":"",l.replace(/^[-•*]\s*/,"")))});
    txt.append(ul);
  }
  if(it.type!=="ws") txt.append(el("p","warn",it.type==="ad"?"Advertisement. Not made or run by us.":"Not run by us. Open at your own risk."));
  if(it.official && it.sourceTruth) txt.append(el("p","warn","Source of truth: "+it.sourceTruth));

  const bd = el("div","badges");
  if(it.version) bd.append(el("span","b ver","v"+it.version));
  bd.append(el("span","b "+it.status,"● "+it.status));
  if(it.official) bd.append(el("span","b off","✓ official"));
  else bd.append(el("span","b"+(it.type==="ad"?" ad":""),TYPE_LABEL[it.type]||it.type));
  if(href && hostOf(href)===location.host.replace(/\.$/,"")) bd.append(el("span","b here","you're here"));
  body.append(txt, bd); c.append(body);

  if(href){
    const acts = el("div","acts");
    const a = el("a","go","Open ↗"); a.href=href; a.target="_blank"; a.rel="noopener noreferrer";
    const cp = el("button","cp","⧉"); cp.type="button"; cp.title="Copy link"; cp.setAttribute("aria-label","Copy link");
    cp.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(href):Promise.reject()).then(()=>{cp.textContent="✓";setTimeout(()=>cp.textContent="⧉",1200)}).catch(()=>prompt("Copy this link:",href))};
    acts.append(a,cp); c.append(acts);
  }
  return c;
}

function render(){
  const items = (data&&data.items)||[];
  const types = [...new Set(items.map(i=>i.type))];
  const chips = $("chips"); chips.replaceChildren();
  if(types.length>1){
    chips.hidden=false;
    ["all",...types].forEach(t=>{
      const b=el("button","chip",t==="all"?"all":(TYPE_LABEL[t]||t)); b.type="button"; b.setAttribute("aria-pressed",String(filter===t));
      b.onclick=()=>{filter=t;render()}; chips.append(b);
    });
  } else {chips.hidden=true;filter="all"}
  const grid = $("grid"); grid.replaceChildren();
  const shown = items.filter(i=>filter==="all"||i.type===filter);
  if(!shown.length) grid.append(el("div","empty","Nothing here yet. Check back soon ✨"));
  const cols = Math.max(1, Math.min(6, shown.length));
  grid.style.setProperty("--cols", cols);
  grid.style.setProperty("--cw", CW[cols]+"px");
  shown.forEach((it,i)=>grid.append(card(it,i)));
}

function notice(msg){const n=$("notice");n.hidden=!msg;n.textContent=msg||""}

function accept(d, fromCache){
  if(!d||!Array.isArray(d.items)) throw new Error("bad feed");
  data=d; lastGood=Date.parse(d.updated)||Date.now(); render();
  if(!fromCache) try{localStorage.setItem(CACHE_KEY,JSON.stringify(d))}catch(e){}
}

async function load(){
  if(SHEET_URL==="SHEET_URL"||!SHEET_URL){accept(DEMO,true);setLive("off","demo mode");notice("Preview only: set SHEET_URL in this file to your deployed data.gs /exec link to go live.");return}
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+"type=board",{signal:ctl.signal});
    const d=await r.json(); if(d.error&&!d.items) throw new Error(d.error);
    accept(d,false); notice(""); setLive("on","live, updated "+ago(d.updated));
  }catch(e){
    if(!data){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c)accept(c,true)}catch(x){}}
    if(data){setLive("off","offline · showing saved board ("+ago(new Date(lastGood).toISOString())+")");notice("Couldn't reach the live board. These links may be out of date.")}
    else{setLive("off","offline");notice("Couldn't reach the live board. Try again in a moment.");$("grid").replaceChildren(el("div","empty","No links loaded."))}
  }finally{clearTimeout(to)}
}

load();
setInterval(load,REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastGood>30000)load()});
</script>
</body>
</html>
